worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
}

http {
    access_log off;
    # 压测时把每条请求写进 access log 会变成瓶颈，所以关掉。
    keepalive_timeout 15s;

    # 不缓存到上游的连接。延迟降到毫秒内时，在途请求只有几个，
    # keepalive 连接池会一直复用先连上的那一台，另一台几乎没有 CPU。
    # random two 在两边活跃连接数相同（通常都是 0）时也不会总选第一台。
    upstream teabreak {
        random two least_conn;
        server api1:8080 max_fails=1 fail_timeout=2s;
        server api2:8080 max_fails=1 fail_timeout=2s;
    }

    server {
        listen 80;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "close";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 1s;
            proxy_read_timeout 5s;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 2s;
            proxy_pass http://teabreak;
        }
    }
}
