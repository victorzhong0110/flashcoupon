# 本地一键起：nginx 后面两份 API，Redis（库存 + Streams）、MySQL、消费者各自一个容器，并加上 CPU / 内存上限。
#
# 消息队列的数据面在 Redis 里，不单独再起一个 Kafka。扣库存和 XADD 必须在同一条 Lua 里，
# 拆到另一个进程就不再原子。消费者是独立容器，cgroup 和 Redis、MySQL 分开，写库打满时不会抢走 Redis 的核。
#
# 主机端口故意避开 3306/6379/8080。资源上限按 4 vCPU 的开发机来配，压测机自己还要留核给 k6。
# 换机器时改下面的 cpus / memory，并在 docs/benchmark-realistic.md 里写实际 inspect 到的值。
name: teabreak

services:
  mysql:
    container_name: teabreak-mysql
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: coupon
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    ports:
      - "13306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    volumes:
      - mysql_data:/var/lib/mysql
    deploy:
      resources:
        limits:
          cpus: "0.70"
          memory: 1024M

  redis:
    container_name: teabreak-redis
    image: redis:7-alpine
    # everysec：最多丢一秒的写。always 更安全但会把 fsync 加进热路径。
    # 这个容器同时承担库存和订单流（MQ）。
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "16379:6379"
    healthcheck:
      # PING 在加载 AOF 时也可能成功，其它命令却还是 LOADING。等 loading:0 再放行依赖它的进程。
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG && redis-cli INFO persistence | grep -q 'loading:0'"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: "1.00"
          # 512MiB 会在加载既有 AOF 时被 OOM kill（RDB 大约 871MiB）。压测用的上限是 2560MiB。
          memory: 2560M

  api1:
    container_name: teabreak-api1
    build: .
    image: teabreak:local
    environment:
      HTTP_ADDR: ":8080"
      MYSQL_DSN: root:root@tcp(mysql:3306)/coupon?parseTime=true&charset=utf8mb4&loc=UTC&timeout=5s&readTimeout=30s&writeTimeout=30s
      REDIS_ADDR: redis:6379
      GLOBAL_RPS: ${GLOBAL_RPS:-0}
      GLOBAL_BURST: ${GLOBAL_BURST:-2000}
      USER_LIMIT: ${USER_LIMIT:-30}
      USER_WINDOW: ${USER_WINDOW:-10s}
      COMBINED_HOTPATH: ${COMBINED_HOTPATH:-0}
      SNOWFLAKE_WORKER: "1"
      PPROF: "1"
    ports:
      - "16060:6060"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "0.35"
          memory: 256M

  api2:
    container_name: teabreak-api2
    image: teabreak:local
    environment:
      HTTP_ADDR: ":8080"
      MYSQL_DSN: root:root@tcp(mysql:3306)/coupon?parseTime=true&charset=utf8mb4&loc=UTC&timeout=5s&readTimeout=30s&writeTimeout=30s
      REDIS_ADDR: redis:6379
      GLOBAL_RPS: ${GLOBAL_RPS:-0}
      GLOBAL_BURST: ${GLOBAL_BURST:-2000}
      USER_LIMIT: ${USER_LIMIT:-30}
      USER_WINDOW: ${USER_WINDOW:-10s}
      COMBINED_HOTPATH: ${COMBINED_HOTPATH:-0}
      SNOWFLAKE_WORKER: "2"
      PPROF: "0"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "0.35"
          memory: 256M

  nginx:
    container_name: teabreak-nginx
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "18080:80"
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 64M

  consumer:
    container_name: teabreak-consumer
    image: teabreak:local
    entrypoint: ["/usr/local/bin/consumer"]
    environment:
      METRICS_ADDR: ":8081"
      MYSQL_DSN: root:root@tcp(mysql:3306)/coupon?parseTime=true&charset=utf8mb4&loc=UTC&timeout=5s&readTimeout=30s&writeTimeout=30s
      REDIS_ADDR: redis:6379
      WORKERS: ${WORKERS:-8}
      MAX_DELIVERIES: "8"
      CLAIM_IDLE: 15s
      CANCEL_EVERY: 1s
      CANCEL_PARALLEL: ${CANCEL_PARALLEL:-4}
      CANCEL_BATCH: ${CANCEL_BATCH:-200}
      CANCEL_FRESH_WINDOW: ${CANCEL_FRESH_WINDOW:-3s}
      REBALANCE_EVERY: 2s
      REBALANCE_GAP: "8"
    ports:
      - "18081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  prometheus:
    container_name: teabreak-prometheus
    image: prom/prometheus:v2.55.1
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "19090:9090"
    depends_on:
      - api1
      - api2
      - consumer

volumes:
  mysql_data:
    name: teabreak-mysql-data
  redis_data:
    name: teabreak-redis-data

networks:
  default:
    name: teabreak
